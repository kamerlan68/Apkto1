
workflows:
  bigtools-android:
    name: BigTools APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Build APK
        script: |
          unzip -o BigTools-Codemagic.zip
          cd BigTools
          gradle assembleRelease --no-daemon
    artifacts:
      - BigTools/app/build/outputs/apk/release/*.apk
